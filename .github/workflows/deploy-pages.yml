name: Deploy Demo Pages

on:
  push:
    branches:
      - claude/build-eat4life-website-01V86jRtpmdCuFxu3he73xcf
      - claude/keen-einstein-ik9e5s
      - main
    paths:
      - "voice-ai-demo-builder/demos/**"
      - "site/**"
      - "assets/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # registry.json holds lead emails and data.json holds raw generated
      # content — neither belongs on the public site.
      - name: Stage public pages only
        run: |
          mkdir -p _site
          rsync -a --exclude registry.json --exclude data.json --exclude processed-submissions.json voice-ai-demo-builder/demos/ _site/
          # Marketing site preview + the Malik / brand images the GHL pages load
          mkdir -p _site/site _site/assets
          python3 site/build.py
          rsync -a site/dist/preview/ _site/site/
          rsync -a assets/ _site/assets/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
