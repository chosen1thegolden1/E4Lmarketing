name: Build Voice AI Demo
run-name: "Demo: ${{ inputs.website_url }} (${{ inputs.rep || 'no rep' }})"

on:
  workflow_dispatch:
    inputs:
      website_url:
        description: "Lead's website URL"
        required: true
        type: string
      lead_email:
        description: "Lead's email (adds/updates the GHL contact)"
        required: false
        type: string
        default: ""
      rep:
        description: "Your rep/affiliate ID (commission attribution)"
        required: false
        type: string
        default: ""

# One build at a time so pool assignment and registry commits never race
concurrency: demo-builder

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: voice-ai-demo-builder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: voice-ai-demo-builder/package-lock.json

      - run: npm ci

      - name: Preflight credential check
        env:
          GHL_API_TOKEN: ${{ secrets.GHL_API_TOKEN }}
          GHL_LOCATION_ID: ${{ secrets.GHL_LOCATION_ID }}
        run: |
          echo "GHL_LOCATION_ID length: ${#GHL_LOCATION_ID} (expected 20)"
          echo "GHL_API_TOKEN length: ${#GHL_API_TOKEN}"
          A=$(curl -s -o /tmp/a.json -w '%{http_code}' "https://services.leadconnectorhq.com/voice-ai/agents?locationId=$GHL_LOCATION_ID&pageSize=1" -H "Authorization: Bearer $GHL_API_TOKEN" -H "Version: 2021-07-28")
          echo "Token + Location test: HTTP $A — $(head -c 200 /tmp/a.json)"
          if [ "$A" != "200" ]; then
            echo "::error::The GHL_API_TOKEN cannot access the configured GHL_LOCATION_ID (HTTP $A). Either the token isn't a Private Integration created inside that sub-account, or it's missing the Voice AI scope. Fix in GHL: Settings → Private Integrations."
            exit 1
          fi
          echo "Preflight passed — credentials reach the configured sub-account."

      - name: Build demo (scrape -> Claude -> render -> GHL agent + pool number)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GHL_API_TOKEN: ${{ secrets.GHL_API_TOKEN }}
          GHL_LOCATION_ID: ${{ secrets.GHL_LOCATION_ID }}
          DEMO_BASE_URL: ${{ vars.DEMO_BASE_URL }}
          WEBSITE_URL: ${{ inputs.website_url }}
          LEAD_EMAIL: ${{ inputs.lead_email }}
          REP: ${{ inputs.rep }}
        run: |
          ARGS=("$WEBSITE_URL" --push)
          [ -n "$LEAD_EMAIL" ] && ARGS+=("--email=$LEAD_EMAIL")
          [ -n "$REP" ] && ARGS+=("--rep=$REP")
          npm run demo -- "${ARGS[@]}"

      - name: Commit demo + registry
        env:
          WEBSITE_URL: ${{ inputs.website_url }}
        run: |
          git config user.name "voice-ai-demo-bot"
          git config user.email "voice-ai-demo-bot@users.noreply.github.com"
          git add demos
          git commit -m "Add voice AI demo for $WEBSITE_URL" || echo "nothing to commit"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"

      # Pushes made with GITHUB_TOKEN don't fire push-triggered workflows,
      # so kick the Pages deploy explicitly.
      - name: Trigger Pages deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy-pages.yml/dispatches" \
            -d "{\"ref\":\"${{ github.ref_name }}\"}"
          echo "Pages deploy dispatched."

      # Waits for the page to go live, then emails the lead the demo link +
      # click-to-call number. Skipped when no lead email was provided.
      - name: Send outreach email to lead
        if: inputs.lead_email != ''
        env:
          GHL_API_TOKEN: ${{ secrets.GHL_API_TOKEN }}
          GHL_LOCATION_ID: ${{ secrets.GHL_LOCATION_ID }}
          DEMO_BASE_URL: ${{ vars.DEMO_BASE_URL }}
          WEBSITE_URL: ${{ inputs.website_url }}
          LEAD_EMAIL: ${{ inputs.lead_email }}
          REP: ${{ inputs.rep }}
        run: |
          ARGS=("$WEBSITE_URL" "$LEAD_EMAIL")
          [ -n "$REP" ] && ARGS+=("--rep=$REP")
          node src/send-email.js "${ARGS[@]}"
