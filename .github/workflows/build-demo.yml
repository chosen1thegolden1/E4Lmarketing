name: Build Voice AI Demo
run-name: "Demo: ${{ inputs.website_url }} (${{ inputs.rep || 'no rep' }})"

on:
  workflow_dispatch:
    inputs:
      website_url:
        description: "Lead's website URL"
        required: true
        type: string
      lead_email:
        description: "Lead's email (adds/updates the GHL contact)"
        required: false
        type: string
        default: ""
      rep:
        description: "Your rep/affiliate ID (commission attribution)"
        required: false
        type: string
        default: ""

# One build at a time so pool assignment and registry commits never race
concurrency: demo-builder

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: voice-ai-demo-builder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: voice-ai-demo-builder/package-lock.json

      - run: npm ci

      - name: Preflight credential check
        env:
          GHL_API_TOKEN: ${{ secrets.GHL_API_TOKEN }}
          GHL_LOCATION_ID: ${{ secrets.GHL_LOCATION_ID }}
        run: |
          EXPECTED="zSBqmFrgOtGwd4ALyIsD"
          echo "GHL_LOCATION_ID length: ${#GHL_LOCATION_ID} (expected 20)"
          if [ "$GHL_LOCATION_ID" = "$EXPECTED" ]; then
            echo "GHL_LOCATION_ID: OK — matches the Eat 4 Life sub-account"
          else
            echo "::error::GHL_LOCATION_ID MISMATCH — the secret does not equal $EXPECTED. Re-add it with exactly that value."
          fi
          echo "GHL_API_TOKEN length: ${#GHL_API_TOKEN}"
          A=$(curl -s -o /tmp/a.json -w '%{http_code}' "https://services.leadconnectorhq.com/voice-ai/agents?locationId=$GHL_LOCATION_ID" -H "Authorization: Bearer $GHL_API_TOKEN" -H "Version: 2021-07-28")
          B=$(curl -s -o /tmp/b.json -w '%{http_code}' "https://services.leadconnectorhq.com/voice-ai/agents?locationId=$EXPECTED" -H "Authorization: Bearer $GHL_API_TOKEN" -H "Version: 2021-07-28")
          echo "Test A (token + your GHL_LOCATION_ID secret): HTTP $A — $(head -c 200 /tmp/a.json)"
          echo "Test B (token + hardcoded Eat 4 Life ID):     HTTP $B — $(head -c 200 /tmp/b.json)"
          if [ "$B" = "200" ] && [ "$A" != "200" ]; then
            echo "::error::Token is GOOD. The GHL_LOCATION_ID secret is the problem — re-add it as exactly $EXPECTED"
            exit 1
          elif [ "$B" != "200" ]; then
            echo "::error::The GHL_API_TOKEN secret cannot access Eat 4 Life (HTTP $B). The token in the secret is not the one from the Eat 4 Life private integration, or is missing the Voice AI scope."
            exit 1
          fi
          echo "Preflight passed — credentials are good."

      - name: Build demo (scrape -> Claude -> render -> GHL agent + pool number)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GHL_API_TOKEN: ${{ secrets.GHL_API_TOKEN }}
          GHL_LOCATION_ID: ${{ secrets.GHL_LOCATION_ID }}
          DEMO_BASE_URL: ${{ vars.DEMO_BASE_URL }}
          WEBSITE_URL: ${{ inputs.website_url }}
          LEAD_EMAIL: ${{ inputs.lead_email }}
          REP: ${{ inputs.rep }}
        run: |
          ARGS=("$WEBSITE_URL" --push)
          [ -n "$LEAD_EMAIL" ] && ARGS+=("--email=$LEAD_EMAIL")
          [ -n "$REP" ] && ARGS+=("--rep=$REP")
          npm run demo -- "${ARGS[@]}"

      - name: Commit demo + registry
        env:
          WEBSITE_URL: ${{ inputs.website_url }}
        run: |
          git config user.name "voice-ai-demo-bot"
          git config user.email "voice-ai-demo-bot@users.noreply.github.com"
          git add demos
          git commit -m "Add voice AI demo for $WEBSITE_URL" || echo "nothing to commit"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
