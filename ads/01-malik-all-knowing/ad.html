<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Malik All-Knowing Ad</title>
<!--
  E4L Ad 01: "Malik knows it all"
  Usage: open ad.html?fmt=feed|square|story&logos=1|0&hero=m2 (or v1..v4 stock)
  feed = 1080x1350 (IG/FB 4:5), square = 1080x1080, story = 1080x1920 (Reels/Stories/TikTok)
  logos=0 renders the "ad-platform safe" version with no third-party logos.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rethink+Sans:wght@500;700;800&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #FFC200;
    --gold-soft: #FFD84D;
    --black: #000;
    --white: #fff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #000; }
  body { font-family: "Rethink Sans", system-ui, sans-serif; color: var(--white); }

  .ad { position: relative; width: 1080px; overflow: hidden; background: #000; }
  .ad.feed   { height: 1350px; }
  .ad.square { height: 1080px; }
  .ad.story  { height: 1920px; }

  /* Hero photo, positioned by JS so the skull opening lands on the funnel point */
  .hero {
    position: absolute; display: block;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 24%, #000 82%, transparent 100%);
            mask-image: linear-gradient(to bottom, transparent 0%, #000 24%, #000 82%, transparent 100%);
  }

  /* Ambient gold haze behind the funnel */
  .haze {
    position: absolute; inset: 0; pointer-events: none;
    background:
      radial-gradient(ellipse 60% 38% at 50% var(--haze-y, 22%), rgba(255,194,0,.18), transparent 70%),
      radial-gradient(ellipse 30% 14% at 50% var(--open-y, 38%), rgba(255,194,0,.35), transparent 70%);
    mix-blend-mode: screen;
  }

  svg.streams { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: screen; }

  /* Logo tiles */
  .tile {
    position: absolute; transform: translate(-50%, -50%) rotate(var(--r, 0deg));
    width: var(--s); height: var(--s); border-radius: calc(var(--s) * .24);
    display: grid; place-items: center;
    background: linear-gradient(145deg, rgba(40,32,8,.92), rgba(8,8,8,.95));
    border: 2px solid rgba(255,194,0,.85);
    box-shadow: 0 0 calc(var(--s) * .35) rgba(255,194,0,.55), inset 0 0 calc(var(--s) * .2) rgba(255,194,0,.18);
    opacity: var(--o, 1);
  }
  .tile img { width: 56%; height: 56%; filter: brightness(0) invert(1); }
  .chip {
    position: absolute; transform: translate(-50%, -50%) rotate(var(--r, 0deg));
    padding: .42em .9em; border-radius: 999px; white-space: nowrap;
    font: 700 var(--fs) / 1 "Rethink Sans", sans-serif; letter-spacing: .01em; color: #fff;
    background: linear-gradient(145deg, rgba(40,32,8,.92), rgba(8,8,8,.95));
    border: 2px solid rgba(255,194,0,.85);
    box-shadow: 0 0 calc(var(--fs) * 1.1) rgba(255,194,0,.5);
    opacity: var(--o, 1);
  }

  /* Lower third */
  .lower {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 0 64px var(--pad-b, 56px);
    background: linear-gradient(to bottom, transparent 0%, rgba(0,0,0,.82) 26%, #000 55%);
  }
  .kicker {
    font: 700 22px/1 "Space Mono", monospace; letter-spacing: .18em; text-transform: uppercase;
    color: var(--gold); margin-bottom: 18px; padding-top: 70px;
  }
  .headline { font-weight: 800; text-transform: uppercase; line-height: .9; letter-spacing: -.02em; }
  .headline .l1 { display: block; font-size: var(--h1, 132px); color: #fff; }
  .headline .l2 { display: block; font-size: var(--h2, 86px); color: var(--gold); text-shadow: 0 0 40px rgba(255,194,0,.35); margin-top: 8px; }
  .rule { height: 4px; width: 140px; background: var(--gold); margin: 30px 0 26px; border-radius: 2px; }
  .foot { display: flex; align-items: center; justify-content: space-between; gap: 24px; }
  .brand { display: flex; align-items: center; gap: 16px; }
  .mark {
    width: 64px; height: 64px; border-radius: 14px; background: var(--gold); color: #000;
    display: grid; place-items: center; font: 800 24px/1 "Rethink Sans", sans-serif; letter-spacing: -.02em;
  }
  .brand-name { font: 800 26px/1.05 "Rethink Sans", sans-serif; text-transform: uppercase; letter-spacing: .02em; }
  .brand-name small { display: block; font: 500 19px/1.3 "Rethink Sans", sans-serif; text-transform: none; color: rgba(255,255,255,.72); letter-spacing: 0; margin-top: 4px; }
  .cta {
    font: 800 24px/1 "Rethink Sans", sans-serif; color: #000; background: var(--gold);
    padding: 20px 28px; border-radius: 999px; white-space: nowrap;
  }
  .legal { position: absolute; right: 22px; bottom: 12px; font: 500 12px/1 "Rethink Sans", sans-serif; color: rgba(255,255,255,.38); }

  .square .kicker { padding-top: 40px; margin-bottom: 14px; font-size: 19px; }
  .square .rule { margin: 22px 0 20px; }
  .story .lower { --pad-b: 250px; } /* keep clear of Stories/Reels UI */
</style>
</head>
<body>
<div id="ad" class="ad">
  <img id="hero" class="hero" alt="Malik, the E4L mascot, smiling with the top of his head open as AI tools pour in">
  <div class="haze"></div>
  <svg class="streams" id="streams"></svg>
  <div id="funnel"></div>
  <div class="lower">
    <div class="kicker">Meet Malik. He already learned every AI tool.</div>
    <h1 class="headline"><span class="l1">99 Problems</span><span class="l2">But AI Ain't One.</span></h1>
    <div class="rule"></div>
    <div class="foot">
      <div class="brand">
        <div class="mark">E4L</div>
        <div class="brand-name">Eat 4 Life Marketing<small>AI Marketing Made Easy.</small></div>
      </div>
      <div class="cta">eat4lifemarketing.com</div>
    </div>
  </div>
  <div class="legal" id="legal">All logos are trademarks of their respective owners. No affiliation implied.</div>
</div>

<script>
(() => {
  const q = new URLSearchParams(location.search);
  const fmt = q.get('fmt') || 'feed';
  const showLogos = q.get('logos') !== '0';
  const heroName = q.get('hero') || 'm2';

  // Skull-opening position inside each 1280x720 render (measured by eye).
  // m* = real Malik (Higgsfield character), v* = early stock stand-ins.
  const OPEN = { m2: [642, 290], v1: [638, 212], v2: [630, 226], v3: [655, 200], v4: [630, 228] };

  // Per-format layout: hero scale, where the opening lands, funnel top/width, headline sizes.
  const L = {
    feed:   { h: 1350, s: 1.25, ox: 540, oy: 530, top: 60,  half: 405, scale: 1.0,  h1: 132, h2: 86 },
    square: { h: 1080, s: 1.05, ox: 540, oy: 392, top: 46,  half: 425, scale: 0.78, h1: 104, h2: 68 },
    story:  { h: 1920, s: 1.35, ox: 540, oy: 840, top: 120, half: 400, scale: 1.12, h1: 140, h2: 92 },
  }[fmt];

  const ad = document.getElementById('ad');
  ad.classList.add(fmt);
  ad.style.setProperty('--h1', L.h1 + 'px');
  ad.style.setProperty('--h2', L.h2 + 'px');
  ad.style.setProperty('--open-y', (L.oy / L.h * 100) + '%');
  ad.style.setProperty('--haze-y', ((L.top + L.oy) / 2 / L.h * 100) + '%');

  const hero = document.getElementById('hero');
  const [hx, hy] = OPEN[heroName];
  hero.src = heroName.startsWith('v') ? `renders-stock/malik-${heroName}.png` : `renders/malik-${heroName}.png`;
  hero.style.width = (1280 * L.s) + 'px';
  hero.style.left = (L.ox - hx * L.s) + 'px';
  hero.style.top = (L.oy - hy * L.s) + 'px';

  if (!showLogos) { document.getElementById('legal').remove(); return; }

  // Brands pouring in. Icons = simple-icons SVGs; chips = brands with no icon available.
  const rows = [
    ['openai', 'claude', 'googlegemini', 'perplexity', 'meta', 'elevenlabs', 'huggingface'],
    ['#Midjourney', 'notion', 'nvidia', 'anthropic', '#DeepSeek', 'canva'],
    ['zapier', '#Grok', 'githubcopilot', 'n8n', '#Mistral AI', 'suno'],
    ['make', 'langchain', '#Runway', 'figma', 'ollama'],
    ['replicate', '#Cursor', 'hubspot', 'googlecloud'],
    ['framer', 'github', '#HeyGen'],
    ['#Kling', '#Veo'],
  ];
  const depths = [0, .2, .38, .54, .68, .8, .9];

  // Deterministic jitter so every render matches.
  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

  const funnel = document.getElementById('funnel');
  const svg = document.getElementById('streams');
  svg.setAttribute('viewBox', `0 0 1080 ${L.h}`);
  svg.innerHTML = `<defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC200" stop-opacity="0"/>
      <stop offset=".55" stop-color="#FFC200" stop-opacity=".55"/>
      <stop offset="1" stop-color="#FFE38A" stop-opacity=".95"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>`;

  const endY = L.oy - 26 * L.scale;
  rows.forEach((row, ri) => {
    const d = depths[ri];
    const half = L.half * Math.pow(1 - d, 0.85) + 20;
    const y0 = L.top + d * (endY - L.top);
    const size = (100 - 60 * d) * L.scale;
    row.forEach((name, i) => {
      const u = row.length === 1 ? 0 : -1 + (2 * i) / (row.length - 1);
      const x = L.ox + u * half + (rnd() - .5) * 26 * (1 - d);
      const y = y0 + (rnd() - .5) * 34 * (1 - d) + Math.abs(u) * 22 * (1 - d);
      const rot = (rnd() - .5) * 22 * (1 - d * .6);

      // Light trail from the tile down into the opening
      const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      const cx = x + (L.ox - x) * .15, cy = y + (L.oy - y) * .75;
      p.setAttribute('d', `M${x},${y} Q${cx},${cy} ${L.ox + u * 18},${L.oy - 6}`);
      p.setAttribute('fill', 'none');
      p.setAttribute('stroke', 'url(#g)');
      p.setAttribute('stroke-width', (3.2 - 2 * d) * L.scale);
      p.setAttribute('stroke-linecap', 'round');
      p.setAttribute('filter', 'url(#glow)');
      svg.appendChild(p);

      let el;
      if (name.startsWith('#')) {
        el = document.createElement('div');
        el.className = 'chip';
        el.textContent = name.slice(1);
        el.style.setProperty('--fs', ((30 - 14 * d) * L.scale) + 'px');
      } else {
        el = document.createElement('div');
        el.className = 'tile';
        el.style.setProperty('--s', size + 'px');
        const img = document.createElement('img');
        img.src = `logos/${name}.svg`;
        img.alt = name;
        el.appendChild(img);
      }
      el.style.left = x + 'px';
      el.style.top = y + 'px';
      el.style.setProperty('--r', rot + 'deg');
      el.style.setProperty('--o', (1 - Math.max(0, d - .7) * 1.6).toFixed(2));
      funnel.appendChild(el);
    });
  });
})();
</script>
</body>
</html>
